---
name: Docker Cleanup
on:
  workflow_dispatch:

env:
  IMAGE_NAME: skyhisi/get_iplayer
  KEEP_COUNT: "10"
  PROTECTED_TAGS: "latest"

concurrency:
  group: docker-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Install skopeo
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y skopeo jq

      - name: Select tags to delete
        id: select
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          KEEP_COUNT: ${{ env.KEEP_COUNT }}
          PROTECTED_TAGS: ${{ env.PROTECTED_TAGS }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          DOCKERHUB_USERNAME="${IMAGE_NAME%%/*}"
          image_ref="docker://docker.io/${IMAGE_NAME}"
          creds="${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}"

          tags_json=$(skopeo list-tags --creds "$creds" "$image_ref" | jq -c '.Tags // []')

          tag_entries='[]'
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue

            inspect_json=$(skopeo inspect --creds "$creds" "${image_ref}:${tag}")
            raw_manifest_file=$(mktemp)
            skopeo inspect --raw --creds "$creds" "${image_ref}:${tag}" > "$raw_manifest_file"
            created=$(jq -r '.Created // empty' <<<"$inspect_json")
            digest=$(skopeo manifest-digest "$raw_manifest_file")
            rm -f "$raw_manifest_file"

            [[ -n "$created" && -n "$digest" ]] || {
              echo "Failed to inspect ${IMAGE_NAME}:${tag}" >&2
              exit 1
            }

            tag_entries=$(jq -c \
              --argjson current "$tag_entries" \
              --arg name "$tag" \
              --arg created "$created" \
              --arg digest "$digest" \
              '$current + [{name: $name, created: $created, digest: $digest}]' <<<"null")
          done < <(jq -r '.[]' <<<"$tags_json")

          sorted_tags=$(jq -c 'sort_by(.created) | reverse' <<<"$tag_entries")
          protected_tags=$(printf '%s\n' "$PROTECTED_TAGS" | sed '/^$/d' | jq -R . | jq -sc '.')
          keepers=$(jq -c --argjson keep_count "$KEEP_COUNT" --argjson protected "$protected_tags" '((.[0:$keep_count] | map(.name)) + $protected) | unique' <<<"$sorted_tags")

          deletion_plan=$(jq -c --argjson keepers "$keepers" '
            reduce .[] as $tag (
              {deleteTags: [], deleteDigests: [], skippedTags: [], digestTags: {}};
              .digestTags[$tag.digest] = ((.digestTags[$tag.digest] // []) + [$tag.name])
            )
            | .digestTags as $digestTags
            | reduce ($digestTags | to_entries[]) as $entry (
                {deleteTags: [], deleteDigests: [], skippedTags: []};
                ($entry.value | map(select(($keepers | index(.)) != null))) as $keptRefs
                | ($entry.value | map(select(($keepers | index(.)) == null))) as $oldRefs
                | if ($oldRefs | length) == 0 then .
                  elif ($keptRefs | length) == 0 then
                    .deleteTags += $oldRefs
                    | .deleteDigests += [$entry.key]
                  else
                    .skippedTags += ($oldRefs | map({name: ., digest: $entry.key, kept_refs: $keptRefs}))
                  end
              )
            | {deleteTags: (.deleteTags | unique), deleteDigests: (.deleteDigests | unique), skippedTags}
          ' <<<"$sorted_tags")

          delete_tags=$(jq -c '.deleteTags' <<<"$deletion_plan")
          delete_digests=$(jq -c '.deleteDigests' <<<"$deletion_plan")
          skipped_tags=$(jq -c '.skippedTags' <<<"$deletion_plan")

          echo "delete_tags=$delete_tags" >> "$GITHUB_OUTPUT"
          echo "delete_digests=$delete_digests" >> "$GITHUB_OUTPUT"
          echo "skipped_tags=$skipped_tags" >> "$GITHUB_OUTPUT"
          echo "tag_count=$(jq 'length' <<<"$sorted_tags")" >> "$GITHUB_OUTPUT"
          echo "delete_digest_count=$(jq 'length' <<<"$delete_digests")" >> "$GITHUB_OUTPUT"
          echo "skip_count=$(jq 'length' <<<"$skipped_tags")" >> "$GITHUB_OUTPUT"

          {
            echo "### Docker tag retention"
            echo
            echo "- Repository: ${IMAGE_NAME}"
            echo "- Total tags found: $(jq 'length' <<<"$sorted_tags")"
            echo "- Protected tags: ${PROTECTED_TAGS:-none}"
            echo "- Tags selected for deletion: $(jq 'length' <<<"$delete_tags")"
            echo "- Manifests selected for deletion: $(jq 'length' <<<"$delete_digests")"
            echo "- Tags skipped because their manifest is still referenced by kept tags: $(jq 'length' <<<"$skipped_tags")"
            echo
            echo "#### Keeping"
            jq -r --argjson keepers "$keepers" '.[] | select(.name as $tag | $keepers | index($tag)) | "- \(.name) (\(.created))"' <<<"$sorted_tags"
            echo
            echo "#### Deleting"
            jq -r --argjson deleteTags "$delete_tags" '.[] | select(.name as $tag | $deleteTags | index($tag)) | "- \(.name) (\(.created))"' <<<"$sorted_tags"
            if [[ $(jq 'length' <<<"$skipped_tags") -gt 0 ]]; then
              echo
              echo "#### Skipped"
              jq -r '.[] | "- \(.name) shares \(.digest) with kept tags: \(.kept_refs | join(", "))"' <<<"$skipped_tags"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete old tags
        if: steps.select.outputs.delete_digest_count != '0'
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DELETE_DIGESTS: ${{ steps.select.outputs.delete_digests }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          DOCKERHUB_USERNAME="${IMAGE_NAME%%/*}"
          creds="${DOCKERHUB_USERNAME}:${DOCKERHUB_TOKEN}"

          jq -r '.[]' <<<"$DELETE_DIGESTS" | while IFS= read -r digest; do
            [[ -n "$digest" ]] || continue
            echo "Deleting ${IMAGE_NAME}@${digest}"
            skopeo delete --creds "$creds" "docker://docker.io/${IMAGE_NAME}@${digest}"
          done