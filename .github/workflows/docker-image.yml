---
name: Docker Image CI
on:
  push:
    branches: ["main"]
    paths-ignore:
      - README.md
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  IMAGE_NAME: skyhisi/get_iplayer
  BASE_IMAGE: docker.io/library/debian
  BASE_TAG: stable-slim

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Get Git commit timestamps
        id: timestamp
        run: echo "value=$(git log -1 --pretty=%ct)" >>$GITHUB_OUTPUT

      - name: Get latest get_iplayer tag
        id: get_iplayer_tag
        run: |
          set -euo pipefail
          tag=$(git ls-remote --tags --refs https://github.com/get-iplayer/get_iplayer 'v*' \
            | awk -F/ '{print $3}' \
            | sort -V \
            | tail -n1)
          [[ -n "$tag" ]] || {
            echo "Could not resolve latest get_iplayer tag" >&2
            exit 1
          }
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
          labels: |
            org.opencontainers.image.base.name=${{ env.BASE_IMAGE }}:${{ env.BASE_TAG }}
          annotations: |
            org.opencontainers.image.base.name=${{ env.BASE_IMAGE }}:${{ env.BASE_TAG }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Resolve build configuration
        id: config
        run: |
          set -euo pipefail
          if [[ "${ACT:-}" == "true" ]]; then
            echo "cache_from=type=local,src=.buildx-cache" >> "$GITHUB_OUTPUT"
            echo "cache_to=type=local,dest=.buildx-cache-new,mode=max" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "use_local_cache=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_from=type=gha,scope=get-iplayer-docker" >> "$GITHUB_OUTPUT"
            echo "cache_to=type=gha,mode=max,scope=get-iplayer-docker" >> "$GITHUB_OUTPUT"
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "use_local_cache=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            base_tag=${{ env.BASE_TAG }}
            get_iplayer_tag=${{ steps.get_iplayer_tag.outputs.value }}
          cache-from: ${{ steps.config.outputs.cache_from }}
          cache-to: ${{ steps.config.outputs.cache_to }}
          platforms: ${{ steps.config.outputs.platforms }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
        env:
          SOURCE_DATE_EPOCH: ${{ steps.timestamp.outputs.value }}

      - name: Finalize local build cache (act)
        if: ${{ steps.config.outputs.use_local_cache == 'true' }}
        run: |
          set -euo pipefail
          rm -rf .buildx-cache
          mv .buildx-cache-new .buildx-cache
